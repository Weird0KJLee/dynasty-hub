<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynasty Hub</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1c1c1a;--muted:#6b6b66;--accent:#1d6b45;--accent-t:#fff;--line:#e4e2da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141513;--card:#1e201d;--text:#ecebe6;--muted:#9a9a92;--accent:#4cc38a;--accent-t:#0d1f16;--line:#2e302b;color-scheme:dark}}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.muted{color:var(--muted)}
.tab{padding:.5rem .9rem;border-radius:999px;border:1px solid var(--line);white-space:nowrap;font-size:.9rem;background:var(--card);color:var(--text)}
.tab.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.row{border-top:1px solid var(--line)}
.pill{font-size:.7rem;padding:.1rem .45rem;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
th{font-weight:500;color:var(--muted);font-size:.75rem;text-align:left;padding:.5rem .6rem}
td{padding:.55rem .6rem;font-size:.9rem}
summary{cursor:pointer}
</style>
</head>
<body>
<div class="max-w-3xl mx-auto px-4 pb-10">
  <header class="pt-5 pb-3">
    <h1 class="text-2xl font-semibold">Dynasty Hub</h1>
    <p id="updated" class="muted text-sm">Loading…</p>
  </header>
  <nav id="tabs" class="flex gap-2 overflow-x-auto pb-3"></nav>
  <main id="view" class="mt-2"></main>
</div>
<script>
const D = {};
let tab = "standings", team = null, names = {};
const TABS = [["standings","Standings"],["matchups","Matchups"],["rosters","Rosters"]];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(n){
  try { const r = await fetch(`data/${n}.json`, {cache:"no-cache"}); if(!r.ok) throw 0; return await r.json(); }
  catch(e){ return null; }
}
function buildNames(li){
  const m = {}, pi = li && (li.playerInfo || li.players);
  const add = (id,p) => { if(!id || !p || typeof p!=="object") return;
    const n = p.name || p.playerName || p.fullName || `${p.firstName||""} ${p.lastName||""}`.trim();
    if(n) m[id] = n; };
  if(Array.isArray(pi)) pi.forEach(p => add(p.id || p.playerId || p.fantraxId, p));
  else if(pi && typeof pi==="object") Object.entries(pi).forEach(([k,p]) => add(p.id || p.playerId || k, p));
  return m;
}
const teamName = id => (D.teamNames && D.teamNames[id]) || id;
const empty = t => `<div class="card p-4 muted text-sm">${t}</div>`;

const V = {
  standings(){
    if(!D.standings) return empty("No standings data yet. Run the “Update Fantrax data” action.");
    const rows = [...D.standings].sort((a,b)=>a.rank-b.rank).map(t =>
      `<tr class="row"><td class="muted">${t.rank}</td><td class="font-medium">${esc(t.teamName)}</td><td>${esc(t.points)}</td><td>${t.winPercentage.toFixed(3).replace(/^0/,"")}</td><td>${t.gamesBack}</td><td>${Math.round(t.totalPointsFor).toLocaleString()}</td></tr>`).join("");
    return `<div class="card overflow-x-auto"><table class="w-full"><tr><th>#</th><th>Team</th><th>W-L-T</th><th>Pct</th><th>GB</th><th>PF</th></tr>${rows}</table></div>`;
  },
  matchups(){
    const ms = D.matchups && D.matchups.matchups;
    if(!ms || !ms.length) return empty("No matchup data yet.");
    return `<p class="muted text-sm mb-2">Scoring period ${D.matchups.period}</p>` + ms.map(m => {
      const a=m.away, h=m.home, aw=a.score>h.score;
      const cats = (m.categories||[]).filter(c => (c.away.display||c.home.display)).map(c =>
        `<div class="flex justify-between text-xs py-1 row"><span>${esc(c.away.display ?? "–")}</span><span class="muted">${esc(c.shortName)} (${esc(c.group)})</span><span>${esc(c.home.display ?? "–")}</span></div>`).join("");
      return `<div class="card p-4 mb-3">
        <div class="flex justify-between ${aw?"font-semibold":"muted"}"><span>${esc(a.teamName)}</span><span>${a.score}</span></div>
        <div class="flex justify-between mt-1 ${!aw?"font-semibold":"muted"}"><span>${esc(h.teamName)}</span><span>${h.score}</span></div>
        <details class="mt-2"><summary class="muted text-xs">Category breakdown</summary><div class="mt-2">${cats}</div></details></div>`;
    }).join("");
  },
  rosters(){
    const R = D.rosters && D.rosters.rosters;
    if(!R) return empty("No roster data yet.");
    const ids = Object.keys(R).sort((a,b)=>R[a].teamName.localeCompare(R[b].teamName));
    if(!team || !R[team]) team = ids[0];
    const sel = ids.map(i=>`<option value="${i}" ${i===team?"selected":""}>${esc(R[i].teamName)}</option>`).join("");
    const groups = [["ACTIVE","Active"],["RESERVE","Reserve"],["INJURED_RESERVE","Injured reserve"],["MINORS","Minors"]];
    const items = R[team].rosterItems;
    const body = groups.map(([k,l]) => {
      const list = items.filter(p=>p.status===k);
      if(!list.length) return "";
      return `<div class="px-4 py-2 text-xs muted row">${l} · ${list.length}</div>` + list.map(p =>
        `<div class="px-4 py-2 flex justify-between row"><span>${esc(names[p.id] || p.id)}</span><span class="pill">${esc(p.position)}</span></div>`).join("");
    }).join("");
    const missing = items.filter(p=>!names[p.id]).length;
    return `<select id="sel" class="card w-full p-3 mb-3" style="color:var(--text)">${sel}</select>
      <div class="card overflow-hidden">${body}</div>
      ${missing ? `<p class="muted text-xs mt-2">${missing} player names not resolved yet (showing Fantrax IDs).</p>`:""}`;
  }
};
function render(){
  document.getElementById("tabs").innerHTML = TABS.map(([k,l])=>`<button class="tab ${k===tab?"on":""}" data-k="${k}">${l}</button>`).join("");
  document.getElementById("view").innerHTML = V[tab]();
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab=b.dataset.k; location.hash=tab; render(); });
  const s = document.getElementById("sel"); if(s) s.onchange = e => { team=e.target.value; render(); };
}
(async () => {
  const [st, mu, ro, li, meta] = await Promise.all(["standings","matchups","rosters","leagueInfo","meta"].map(load));
  D.standings = Array.isArray(st) ? st : (st && st.standings) || null;
  D.matchups = mu; D.rosters = ro;
  D.teamNames = {};
  (D.standings||[]).forEach(t => D.teamNames[t.teamId] = t.teamName);
  names = buildNames(li);
  document.getElementById("updated").textContent = meta && meta.updatedAt
    ? "Updated " + new Date(meta.updatedAt).toLocaleString() : "Waiting for first data update";
  const h = location.hash.slice(1); if(TABS.some(t=>t[0]===h)) tab = h;
  render();
})();
</script>
</body>
</html>
